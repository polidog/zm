# タグ（v*）を push すると .github/workflows/release.yaml から呼ばれ、GitHub Releases にバイナリを置く。
# ペダルとは ALSA rawmidi で話すので Linux だけ作る。
version: 2

builds:
  - main: ./cmd/zm
    binary: zm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/polidog/zm/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - LICENSE
      - README.md
      - README.ja.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
